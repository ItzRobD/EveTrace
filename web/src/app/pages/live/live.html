<div class="page-header">
  <h2>Live Dashboard</h2>
</div>

@if (loading()) {
  <div class="skeleton-wrap">
    <p-skeleton height="260px" styleClass="mb-3" />
    <p-skeleton height="260px" />
  </div>
} @else if (activeChars().length === 0) {
  <div class="empty-state">
    <i class="pi pi-wifi"></i>
    <h3>Waiting for live events…</h3>
    <p>Start EVE Online and ensure the backend is watching your log directory. Events will appear here in real time.</p>
  </div>
} @else {
  <div class="char-grid">
    @for (state of activeChars(); track state.characterName) {
      <app-character-card [state]="state" />
    }
  </div>
}
