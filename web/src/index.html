<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Evetrace</title>
    <base href="/" />
    <!-- Apply the persisted theme before first paint to avoid a flash of the
         wrong theme. Mirrors ThemeService (key 'evetrace-theme', default dark). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('evetrace-theme') !== 'light') {
            document.documentElement.classList.add('app-dark');
          }
        } catch (e) {
          document.documentElement.classList.add('app-dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#080b0e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
